application:
  subdomain: better-status-page
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://better-status-page:3000/
  injects:
    # The setup wizard and login page need the deployed admin credentials.
    - id: login-autofill
      when:
        - /login
        - /setup
      do:
        - src: builtin://simple-inject-password
          params:
            user: "{{ .U.admin_email }}"
            password: "{{ .U.admin_password }}"
    # Logo upload and data export use native file pickers, which the store
    # requires to route through the LazyCat cloud drive.
    - id: open-save-chooser
      on: browser
      when:
        - /*
      do:
        - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
services:
  better-status-page:
    # ghcr.io/belluu/better-status-page:0.6.0
    # upstream: ghcr.io/belluu/better-status-page:0.8.0
    image: ghcr.1ms.run/belluu/better-status-page:0.8.0
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/db.sqlite
      - UPLOAD_DIR=/app/data/uploads
      - BACKUP_DIR=/app/backups
      - JWT_SECRET={{ stable_secret "bsp_jwt_secret" }}
      - VAULT_ENCRYPTION_KEY={{ stable_secret "bsp_vault_key" }}
    binds:
      - /lzcapp/var/data:/app/data
      - /lzcapp/var/backups:/app/backups
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:3000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
