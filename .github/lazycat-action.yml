version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/better-status-page.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: better-status-page

build:
  toolchains: []
  run_buildscript: false

images:
  - id: better-status-page
    target: service
    service: better-status-page
    source: ghcr.io/belluu/better-status-page
    channel: stable
    sort: semver
    # Strict three-part tags; the legacy v-prefixed 0.1.0 and latest are excluded.
    tag_regex: ^[0-9]+[.][0-9]+[.][0-9]+$
    delivery:
      mode: mirror
      image_template: "ghcr.1ms.run/belluu/better-status-page:{tag}"
      require_digest_match: true

stores:
  official:
    enabled: false
    skip_if_version_exists: false
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: BetterStatusPage 状态页
    summary: 镜像加速模式自动跟上游 GHCR 版本发布的自托管状态页
